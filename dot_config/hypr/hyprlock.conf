$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

animations {
    enabled = true
    bezier = ease, 0.23, 1, 0.32, 1
    animation = fade, 1, 3, ease
    animation = inputField, 1, 3, ease
}

background {
    monitor =
    path = /home/dieg0/Pictures/Wallpapers/understory-pattern-dark.png
    blur_passes = 3
    blur_size = 6
    color = rgb(181b16)
}

label {
    monitor =
    text = $TIME
    color = rgb(d8d2c4)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(8ead73)
    font_size = 18
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = 󱔐  $USER
    color = rgb(a47b50)
    font_size = 16
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    outer_color = rgb(66845a)
    inner_color = rgba(181b16e6)
    font_color = rgb(d8d2c4)
    check_color = rgb(8ead73)
    fail_color = rgb(b8645b)
    capslock_color = rgb(c59b58)
    rounding = 14
    font_family = $font
    placeholder_text = Enter password
    check_text = Checking…
    fail_text = $FAIL
    fade_on_empty = false
    dots_spacing = 0.25
    position = 0, -45
    halign = center
    valign = center
}

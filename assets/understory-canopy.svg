<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title description">
  <title id="title">Understory</title>
  <desc id="description">A shadowy tropical canopy with hanging vines framing the Understory Arch Linux rice.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10130f"/>
      <stop offset="0.55" stop-color="#181b16"/>
      <stop offset="1" stop-color="#20251d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8ead73" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8ead73" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M-10 30C20 5 55 55 100 18M-20 72C22 42 63 95 110 58" fill="none" stroke="#a47b50" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1400" height="440" rx="28" fill="url(#night)"/>
  <rect width="1400" height="440" rx="28" fill="url(#grain)"/>
  <ellipse cx="700" cy="210" rx="510" ry="245" fill="url(#glow)" filter="url(#soft)"/>


    <text x="700" y="274" fill="#d8d2c4" font-size="82" font-weight="720" letter-spacing="5">UNDERSTORY</text>
    <text x="700" y="322" fill="#89b49b" font-size="24" letter-spacing="2">tropical shade · dark hardwood · climbing green</text>
